AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Sightline read-only access role.

  This template provisions a cross-account IAM role that Sightline assumes in
  order to discover and inventory AWS resources in a customer account. It
  grants the AWS-managed ReadOnlyAccess policy and nothing else. Sightline
  cannot create, modify, or delete any resource via this role.

  Trust model: Sightline's platform account assumes this role using an
  ExternalId that is unique per customer, mitigating the confused-deputy
  attack pattern (see AWS docs on cross-account access).

  --------------------------------------------------------------------------
  NOTE TO CANDIDATE
  --------------------------------------------------------------------------
  You do NOT need to deploy this template. It describes how Sightline obtains
  access to a customer AWS account in production today. You can use it as
  is, modify it, or replace it with something better. If you change it,
  tell us why.
  --------------------------------------------------------------------------

Parameters:
  SightlineAccountId:
    Type: String
    Description: The Sightline platform AWS account ID that will assume this role.
    Default: "123456789012"
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: Must be a 12-digit AWS account ID.

  ExternalId:
    Type: String
    Description: >
      A unique, per-customer secret shared between Sightline and this account.
      Sightline issues this value at onboarding. Treat it as a credential.
    NoEcho: true
    MinLength: 16
    MaxLength: 128

  RoleName:
    Type: String
    Description: Name of the IAM role to create.
    Default: "SightlineReadOnlyRole"

Resources:
  SightlineReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: >
        Allows Sightline to read AWS resource metadata for inventory and
        visualization. Grants no write or delete permissions.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${SightlineAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Tags:
        - Key: ManagedBy
          Value: Sightline
        - Key: Purpose
          Value: read-only-inventory

Outputs:
  RoleArn:
    Description: ARN of the role Sightline should assume. Share this with onboarding.
    Value: !GetAtt SightlineReadOnlyRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RoleArn"

  ExternalIdReminder:
    Description: >
      The ExternalId you provided at stack creation. Sightline needs both this
      and the RoleArn above to complete onboarding.
    Value: "Provided at stack creation — see your Sightline onboarding email."
