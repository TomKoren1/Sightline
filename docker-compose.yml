# Local development stack for Sightline.
#
#   docker compose up -d                  dependencies only (the documented path)
#   docker compose --profile app up -d    the whole thing, including the app
#   docker compose --profile app down -v  tear down, whichever way you started
#
# The flag is needed on `down` too: without it Compose only removes the services
# in the default configuration, leaving the api and web containers running
# against databases that no longer exist. It is harmless if the profile was never
# started, so it is the one teardown command to remember.
#
# The `app` profile is additive and opt-in. Without it this file behaves exactly
# as it always has, so the instructions in the README cannot be broken by the
# containerised path misbehaving on a platform I cannot test.
#
# Three services:
#   postgres  - system of record: scan runs, resource snapshots, agent traces
#   neo4j     - derived graph projection the agent traverses
#   moto      - mock AWS control plane (see docs/DECISIONS.md ADR-002)
#
# Credentials and ports come from .env - see .env.example.

services:
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: sightline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sightline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sightline}
      POSTGRES_DB: ${POSTGRES_DB:-sightline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sightline}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26.31-community@sha256:ab3aafb0020e6fed65bb2b59f7db1fabd7ee0568c4da46f3cc3b8fad77801d61
    container_name: sightline-neo4j
    restart: unless-stopped
    environment:
      # Format is user/password. Neo4j requires the password to be 8+ chars.
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4jneo4j}
      #
      # No APOC. It was loaded with `dbms.security.procedures.unrestricted=apoc.*`
      # - the widest setting there is - and used by nothing: the only mentions in
      # the repository are in `cypherGuard.test.ts`, as examples of calls the
      # guard must reject. The agent's escape hatch forbids `CALL` outright, so
      # the procedures were unreachable through the product and present only as
      # standing surface on the database holding every tenant's inventory.
      #
      # `server.memory.*`, not `dbms.memory.*`. 5.26 honours the old names with a
      # deprecation warning on every boot, which is how a setting survives being
      # renamed out from under it and then silently stops applying on an upgrade.
      #
      # Sized against this machine and this store rather than by reflex. The
      # store is a few megabytes, so a page cache larger than this buys nothing
      # except memory the host does not have - 1G holds a store far bigger than
      # anything a single-node deployment of this will hold. Heap is driven by
      # transaction working set, and projection commits in batches of a couple of
      # thousand nodes with bounded concurrency, so it does not grow with the
      # size of the account being scanned. Initial equals max to keep the JVM
      # from resizing the heap under load, which shows up as GC pauses mid-scan.
      #
      # Production sizing belongs in the k8s overlay, where the node's memory and
      # the real store size are known. These are the development and CI numbers.
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-2G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-2G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGE_CACHE:-1G}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # browser UI
      - "${NEO4J_BOLT_PORT:-7687}:7687" # driver protocol
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Mock AWS control plane. Speaks the real AWS API over HTTP, so the scanner
  # exercises its real code paths (assume-role, pagination, retries, region
  # fan-out) and differs from production only by an endpoint override.
  #
  # MOTO_ACCOUNT_ID must match the account in AWS_TARGET_ROLE_ARN: moto
  # namespaces resources by the account ID carried in the credentials, so a
  # mismatch silently writes into a different account. See ENGINEERING-LOG #2.
  moto:
    image: motoserver/moto:5.2.3@sha256:91fd602a21f49cf9eb82fdf474015a3c131d40104c8297ea6a2ca920708ae32c
    container_name: sightline-moto
    restart: unless-stopped
    environment:
      MOTO_ACCOUNT_ID: ${MOCK_AWS_ACCOUNT_ID:-123456789012}
      # AWS-managed policies (AdministratorAccess etc.) are not loaded by
      # default; without this AttachRolePolicy throws NoSuchEntityException.
      MOTO_IAM_LOAD_MANAGED_POLICIES: "true"
    ports:
      - "${MOCK_AWS_PORT:-5000}:5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request;urllib.request.urlopen(''http://localhost:5000/moto-api/'')" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # Optional `app` profile: the API and the built frontend.
  # ---------------------------------------------------------------------------
  #
  # Every connection default in apps/api/src/config.ts is `localhost`, which is
  # correct on a laptop and wrong inside a container. The overrides below are set
  # in `environment:`, which takes precedence over `env_file`, so the container
  # gets container hostnames while `.env` stays the single source of truth for
  # local development. Duplicating those values into a second env file would
  # guarantee they eventually disagree.

  # One-shot seeder, so the mock account is populated before the API starts.
  #
  # A separate service rather than an API entrypoint step because `seed()` calls
  # `resetMoto()` first: running it on every API boot would wipe the account
  # whenever the container restarted, and the next scan diff would report every
  # resource as new. `service_completed_successfully` gives exactly-once per
  # `up` instead.
  seed:
    profiles: ["app"]
    build:
      context: .
      target: api
    container_name: sightline-seed
    restart: "no"
    # Optional, so `docker compose --profile app up` works on a fresh clone with
    # no setup step at all. Every value it would supply has a default here or in
    # `config.ts`; a `.env` only overrides them.
    env_file:
      - path: .env
        required: false
    environment:
      AWS_ENDPOINT_URL: http://moto:5000
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
    depends_on:
      moto:
        condition: service_healthy
    command: ["npm", "run", "seed"]

  api:
    profiles: ["app"]
    build:
      context: .
      target: api
    container_name: sightline-api
    restart: unless-stopped
    # Optional, so `docker compose --profile app up` works on a fresh clone with
    # no setup step at all. Every value it would supply has a default here or in
    # `config.ts`; a `.env` only overrides them.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sightline}:${POSTGRES_PASSWORD:-sightline}@postgres:5432/${POSTGRES_DB:-sightline}
      NEO4J_URI: bolt://neo4j:7687
      AWS_ENDPOINT_URL: http://moto:5000
      # Loopback would accept nothing from the nginx container.
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "3000"
      # Scans run in the `worker` service below, not here.
      #
      # Self-hosted would default to `embedded`, and this profile deliberately
      # overrides it: the two-process topology is what a hosted deployment runs,
      # it is the arrangement most likely to be subtly wrong, and this is the
      # only place that exercises it end to end. Running the worker in-process
      # here would test the same path twice and the real one never.
      SCAN_WORKER: separate
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      moto:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      # 127.0.0.1, not localhost. In this image `localhost` resolves to ::1,
      # and Fastify bound to 0.0.0.0 listens on IPv4 only - so a `localhost`
      # probe is refused while the server is working perfectly, leaving the
      # container permanently unhealthy and `web` refusing to start behind it.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      # tsx compiles on boot, and the server applies the schema before listening.
      start_period: 30s

  # Scans, out of the request path.
  #
  # The same image as the API - it already carries the whole workspace and runs
  # through tsx - with a different command. A scan holds an account's inventory
  # in memory and then projects it, so it is the one thing here that can consume
  # an unbounded amount of memory; in its own process it takes down a worker
  # rather than the API serving everybody else.
  #
  # No ports and no healthcheck: it serves nothing. Work arrives through the
  # `scan_jobs` table and `heartbeat_at` is how anything else learns it is
  # alive, which makes liveness a question for the database rather than a probe.
  worker:
    profiles: ["app"]
    build:
      context: .
      target: api
    container_name: sightline-worker
    restart: unless-stopped
    command: ["npm", "run", "worker", "-w", "@sightline/api"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sightline}:${POSTGRES_PASSWORD:-sightline}@postgres:5432/${POSTGRES_DB:-sightline}
      NEO4J_URI: bolt://neo4j:7687
      AWS_ENDPOINT_URL: http://moto:5000
      SCAN_WORKER: separate
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      moto:
        condition: service_healthy
      # The API applies the schema on boot, and the worker deliberately does
      # not migrate - two processes racing to migrate is the problem a migration
      # Job exists to solve. So it waits for the one that does.
      api:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: .
      target: web
    container_name: sightline-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
