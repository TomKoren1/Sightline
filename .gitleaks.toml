# Secret-scanning rules.
#
# The default rule set did not flag a committed `.env.mock-backup` holding a
# live Anthropic key and a per-customer ExternalId (engineering log #26), so
# both are covered explicitly here alongside the defaults.
#
# Note on regex syntax: gitleaks uses Go's RE2, which has **no lookarounds**.
# An earlier version of this file used `(?!replace-me|...)` to exclude
# placeholders; RE2 rejected it and gitleaks panicked, which meant the secret
# scan was not running at all. Exclusions belong in an allowlist, not a
# lookahead.

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[a-zA-Z0-9_\-]{20,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "daveio-external-id"
description = "Per-customer AWS ExternalId, which the role template treats as a credential"
regex = '''(?i)aws_external_id\s*=\s*[^\s"'#]{12,}'''
keywords = ["aws_external_id"]

  # Placeholders are not secrets. Expressed as an allowlist because RE2 cannot
  # do the negative lookahead this would otherwise want.
  [rules.allowlist]
  regexTarget = "line"
  regexes = [
    '''(?i)aws_external_id\s*=\s*replace-me''',
    '''(?i)aws_external_id\s*=\s*local-dev''',
    '''(?i)aws_external_id\s*=\s*<''',
    '''(?i)aws_external_id\s*=\s*\$\{''',
  ]

# The `regexes` below are reviewed strings, not paths. Allowlisting a *file*
# would silence it for ever, including the day something real is pasted into
# it - not hypothetical here: this scanner has already caught a live
# Cloudflare tunnel token committed to this repository.
#
# They are log-redaction canaries, written to look like secrets and asserted
# *absent* from log output. The current tree uses readable words instead,
# after this scanner correctly objected to the originals; these survive only
# in branch history, and rewriting that would mean a force-push over a shared
# ref for no security benefit.
# One commit, allowlisted by SHA rather than by value.
#
# 0de7693 contains a Cloudflare tunnel token that was pasted into a Secret
# template and committed by `git add -A` (engineering log #45). **The token was
# rotated on 2026-09-27**, so the string in that commit no longer authorises
# anything, and rewriting shared history for a dead credential would be a
# bigger hammer than the problem.
#
# By SHA, not by the value: writing the token into this file would put it back
# in the current tree, and allowlisting its *shape* would blind the scanner to
# the next one. This entry silences exactly one reviewed commit and nothing
# else - a token committed tomorrow still fails the build.
[allowlist]
description = "Placeholders in the committed example, the patterns this file quotes, reviewed canaries, and one rotated token"
commits = [
  "0de769350f9859a8ff16bb7d82eadb41e1c0c042",
]
paths = ['''\.env\.example$''', '''\.gitleaks\.toml$''']
regexes = [
  "ANTHROPICKEYCANARY0000",
  "SESSIONSECRETCANARY000",
  "AWSSECRETACCESSKEYCANARY",
  "EXTERNALIDCANARY0000000000",
  "COOKIECANARY0000",
  "IDTOKENCANARY000",
]
