# Secret-scanning rules.
#
# The default rule set did not flag a committed `.env.mock-backup` holding a
# live Anthropic key and a per-customer ExternalId (engineering log #26), so
# both are covered explicitly here alongside the defaults.
#
# Note on regex syntax: gitleaks uses Go's RE2, which has **no lookarounds**.
# An earlier version of this file used `(?!replace-me|...)` to exclude
# placeholders; RE2 rejected it and gitleaks panicked, which meant the secret
# scan was not running at all. Exclusions belong in an allowlist, not a
# lookahead.

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[a-zA-Z0-9_\-]{20,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "sightline-external-id"
description = "Per-customer AWS ExternalId, which the role template treats as a credential"
regex = '''(?i)aws_external_id\s*=\s*[^\s"'#]{12,}'''
keywords = ["aws_external_id"]

  # Placeholders are not secrets. Expressed as an allowlist because RE2 cannot
  # do the negative lookahead this would otherwise want.
  [rules.allowlist]
  regexTarget = "line"
  regexes = [
    '''(?i)aws_external_id\s*=\s*replace-me''',
    '''(?i)aws_external_id\s*=\s*local-dev''',
    '''(?i)aws_external_id\s*=\s*<''',
    '''(?i)aws_external_id\s*=\s*\$\{''',
  ]

[allowlist]
description = "The committed example carries placeholders only, and this file quotes the patterns it matches"
paths = ['''\.env\.example$''', '''\.gitleaks\.toml$''']

# Two commits, allowlisted by SHA rather than by path or by value.
#
# Both hold **synthetic** credential-shaped strings in test fixtures, and both were
# caught by this scanner doing its job:
#
#   48b292c  a fake Anthropic key in a masking test, where the value's shape was
#            irrelevant to the assertion - masking is decided by the variable name.
#   b74f1d5  the positive controls of `setup/fixtures.test.ts`, which mirrors these
#            rules in the unit suite. A test proving it detects credential-shaped
#            strings needs one to detect, so it necessarily contained them.
#   e07e702  engineering log #50, which quoted the CI pattern it was describing -
#            a write-up of the bug reproducing the bug. Now described, not quoted.
#
# Each was fixed in the tree and each still needed an entry, because gitleaks scans
# a pull request's commit **range**: fixing forward is not the same as fixing. That
# is the single most useful thing in this list.
#
# Nothing was rotated because nothing was real. The current tree assembles those
# probes at run time instead, so it matches no rule here; the strings survive only
# in this branch's history, and force-pushing over a ref with an open PR is a bigger
# hammer than the problem - the same call made for the rotated token previously.
#
# By SHA, not by path: allowlisting `fixtures.test.ts` would silence that file for
# ever, including the day something real is pasted into it. These two entries
# silence exactly two reviewed commits. A key committed tomorrow still fails.
#
# The three below were added later, when a full-history scan surfaced them.
# `pull_request` runs scan only the PR's commit range and `push` only the
# pushed range, so nothing had ever looked at the whole history until a
# `workflow_dispatch` run did - a blind spot worth closing, because a scanner
# that cannot be run over everything is a scanner with a shape of leak it never
# sees.
#
#   b2d1140  `apiKey: "fake-anthropic-key"` in the logging redaction test. A
#            test proving a field is redacted needs a value to redact.
#   6011ae9  two synthetic `sk-ant-` strings in the secrets tests, one of them
#            asserted on by `not.toContain("abcdefgh")` - the value's shape is
#            the fixture.
#   770ce9c  the ExternalId pattern quoted in ci.yml, which is this repository's
#            recurring own-goal: a file describing the rule matching the rule.
commits = [
  "48b292c0266dd7f4b2c9fcc1a3260b3126ae5cc5",
  "b74f1d5c6c1ea7941a4d0e49435af5919591db69",
  "e07e702dfec8a4db3631b1c510b75360fd155e62",
  "b2d1140eb293ea06c35a088170d4b21a0cfab8be",
  "6011ae98ae23a861797fe3625cb7e4242d545c61",
  "770ce9c1f34876b316afb1433e42cccc88e0f93c",
]

# ---------------------------------------------------------------------------
# NOT allowlisted, on purpose: commit 0de7693.
#
# `helm/daveio/templates/secrets-sealedsecret.yaml` carried a **real**
# Cloudflare tunnel token in a plain `kind: Secret`. It base64-decodes to
# `{"a","t","s"}`, which is the shape of a live cloudflared credential, and it
# is in the pushed history of a public repository.
#
# It was caught at the time, one commit late, and 8bff63c removed the template
# and said plainly: "The token must be rotated: it is in pushed history, and
# rotation is what makes the leaked value worthless." Nothing in this
# repository records that the rotation happened.
#
# So this entry is deliberately absent and a full-history scan stays red. That
# is the correct state: the red is the reminder, and silencing a real
# credential is the one thing an allowlist must never be used for. Tunnel
# `01312003-9250-4569-9510-264b48c497cb` - delete it in Cloudflare (or
# `cloudflared tunnel delete`), create a new one, and only then add:
#
#   "0de769350f9859a8ff16bb7d82eadb41e1c0c042",  # rotated YYYY-MM-DD
# ---------------------------------------------------------------------------
