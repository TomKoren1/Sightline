# Sightline's prod overlay, reconciled by ArgoCD like the monitoring chart, so
# one tool owns what runs and drift shows as OutOfSync rather than going
# unnoticed.
#
# Not applied by anything in this repository: `kubectl apply -f` it after
# changing it. Images come from ghcr.io: .github/workflows/deliver.yml builds
# them for each commit on main that passes CI and pins this overlay to their
# digests, and that pin commit is the change ArgoCD rolls out - on its own.
#
# Prune cannot reach the data: the Postgres StatefulSet and the backups PVC
# carry Prune=false and Delete=false (infra/argocdTracking.test.ts). A manual
# sync must never use the `apply` strategy: it skips the migrate hook, and
# ArgoCD keeps a strategy in status.operationState across operations, so it
# went on skipping hooks for later syncs until removed by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sightline-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TomKoren1/Sightline.git
    targetRevision: main
    # The migrate Job is a PreSync hook (base/app.yaml), so it runs before
    # each sync and is recreated, not patched.
    path: deploy/k8s/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: sightline
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
