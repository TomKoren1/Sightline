# Gives the containerised API the host's AWS profile, for AWS_MODE=real.
#
#   docker compose -f docker-compose.yml -f deploy/compose.aws-profile.yml \
#     --profile app up -d
#
# Why this is a separate file rather than a mount in docker-compose.yml: the
# path has to come from ${HOME}, which is not set on every platform Compose
# runs on. An unset variable there makes the volume spec invalid and breaks the
# *whole* compose file, including the mock path that has nothing to do with
# real AWS. Opt-in costs one flag and cannot break anyone who does not use it.
#
# In AWS_MODE=real the scanner uses the standard AWS credential chain. On a host
# that reaches ~/.aws; a container has no such directory unless it is given one,
# so a profile that works locally fails inside the container with "No source
# credentials were found" - which is accurate and easy to misread as a broken
# connection rather than a missing mount.
#
# Read-only, because the scanner has no business writing credentials. This also
# carries an SSO token cache, so `aws sso login` on the host works here too.
#
# The alternative - real long-lived keys in .env - is worse: this project argues
# for scoped, temporary credentials, and baking an access key into a file that
# sits next to the code is the opposite of that.

services:
  api:
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
