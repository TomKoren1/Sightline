# Serves the built SPA and proxies the API, mirroring what the Vite dev server
# does in development (see apps/web/vite.config.ts).
#
# Keeping the frontend origin-relative means there is no CORS to configure and
# no API base URL baked into the build: the same bundle works behind the dev
# proxy and behind this one.

server {
  listen 80;
  server_name _;

  # No version in error pages and the Server header.
  server_tokens off;

  # Security headers, on every response including errors (`always`). Declared
  # here and nowhere else: a location with an add_header of its own would
  # silently drop all of these for its responses.
  #
  # CSP: the build loads nothing from elsewhere - no CDN, no fonts, no inline
  # script - so everything is 'self'. Styles allow 'unsafe-inline' because the
  # graph renderer positions nodes with style attributes; scripts do not.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  # TLS ends at the Cloudflare tunnel; browsers honour this only over HTTPS,
  # which is how it reaches them.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # SPA: unknown paths are routes, not missing files.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Scans and agent answers are server-sent event streams. Without these,
    # nginx buffers the whole response and delivers it at the end, which
    # defeats the live progress reporting entirely - the same problem the Vite
    # proxy has to solve in development.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    chunked_transfer_encoding off;

    # A scan against a large account, and an agent answer that calls several
    # tools, both outlast the default 60s.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}
