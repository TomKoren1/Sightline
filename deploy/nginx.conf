# Serves the built SPA and proxies the API, mirroring what the Vite dev server
# does in development (see apps/web/vite.config.ts).
#
# Keeping the frontend origin-relative means there is no CORS to configure and
# no API base URL baked into the build: the same bundle works behind the dev
# proxy and behind this one.

server {
  listen 80;
  server_name _;

  # SPA: unknown paths are routes, not missing files.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Scans and agent answers are server-sent event streams. Without these,
    # nginx buffers the whole response and delivers it at the end, which
    # defeats the live progress reporting entirely - the same problem the Vite
    # proxy has to solve in development.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    chunked_transfer_encoding off;

    # A scan against a large account, and an agent answer that calls several
    # tools, both outlast the default 60s.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}
