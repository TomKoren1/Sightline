# The production overlay: a namespace, the tunnel, and the secrets.
#
# What is *not* here is as deliberate as what is: no plaintext secret, and no
# `secretGenerator` reading a file from the working directory. Both would put a
# credential one `git add -A` away from being public, in a repository that is
# public. `secrets.sealedsecret.yaml` is encrypted to this cluster's
# sealed-secrets controller and is safe to commit; `scripts/seal-prod-secrets.sh`
# produces it from the live secrets, and `README.md` has the rest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sightline

resources:
  - namespace.yaml
  - ../base
  - cloudflared.yaml
  # Generated by `kubeseal`, encrypted to this cluster, and committed. Absent
  # from the repository until an operator creates it: a placeholder with fake
  # values would deploy, start, and fail at the first sign-in with an error
  # about Google rather than about configuration. The name ends in
  # `sealedsecret.yaml` because that is the path `.gitleaks.toml` exempts.
  - secrets.sealedsecret.yaml

