apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "daveio.fullname" . }}-api
  labels: {{- include "daveio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: daveio-api
  template:
    metadata:
      labels:
        app: daveio-api
      annotations:
        {{- if .Values.monitoring.scrape }}
        # Annotation-based discovery, which is how this cluster's Prometheus
        # already finds the sibling project's pods. /metrics carries no tenant
        # ids, ARNs or secrets (ADR-021), which is what makes it safe to serve
        # unauthenticated - Prometheus has no session and cannot be given one.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ .Values.api.service.port | quote }}
        {{- end }}
        # Roll the pods when the secret changes, which `helm upgrade` does not
        # do on its own: a rotated session secret otherwise takes effect at the
        # next unrelated deploy, which is a confusing time to be signed out.
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets-sealedsecret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.service.port }}
          env:
            {{- include "daveio.apiEnv" . | nindent 12 }}
            - name: BACKEND_PORT
              value: {{ .Values.api.service.port | quote }}
            # Listens on all interfaces in the cluster: the Service reaches it
            # over the pod network, not over loopback as in development.
            - name: BACKEND_HOST
              value: "0.0.0.0"
          readinessProbe:
            httpGet: { path: /api/health, port: {{ .Values.api.service.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: {{ .Values.api.service.port }} }
            # Generous: the health check touches Postgres and Neo4j, and a slow
            # database should not get the API killed and restarted into the
            # same slow database.
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "daveio.fullname" . }}-api
  labels: {{- include "daveio.labels" . | nindent 4 }}
spec:
  selector:
    app: daveio-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.port }}
