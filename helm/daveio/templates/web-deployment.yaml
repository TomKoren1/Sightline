apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "daveio.fullname" . }}-web
  labels: {{- include "daveio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app: daveio-web
  template:
    metadata:
      labels:
        app: daveio-web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: 80
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "daveio.fullname" . }}-web
  labels: {{- include "daveio.labels" . | nindent 4 }}
spec:
  selector:
    app: daveio-web
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: 80
