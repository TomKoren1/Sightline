{{/*
The scan worker.

Scans are queued work rather than request handlers: a scan of a real account
takes minutes, outlives the request that asked for it, and must survive this
pod being replaced. `scan_jobs` holds the queue, with one active scan per
tenant enforced by a partial unique index and one worker per job by
FOR UPDATE SKIP LOCKED (ADR-020's sibling work, apps/api/src/scan/jobs.ts).

Deliberately **one replica**. The claim is safe for several, but a single
worker keeps total AWS call volume predictable, and this cluster has one
tenant's worth of work to do.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "daveio.fullname" . }}-worker
  labels: {{- include "daveio.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    # Never two workers during a rollout: the claim would tolerate it, but a
    # scan interrupted mid-flight has to wait for the reaper, and an avoidable
    # overlap is an avoidable orphan.
    type: Recreate
  selector:
    matchLabels:
      app: daveio-worker
  template:
    metadata:
      labels:
        app: daveio-worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          # tsx rather than a compiled bundle: this project runs TypeScript
          # directly everywhere else, and introducing a build step for one
          # container is a second way for the worker and the API to differ.
          command: ["npm", "run", "worker", "-w", "@daveio/api"]
          env:
            {{- include "daveio.apiEnv" . | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
