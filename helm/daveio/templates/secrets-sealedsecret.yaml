{{/*
Placeholder, not a secret.

The real file is a SealedSecret, encrypted with the cluster's public key and
therefore safe to commit - see helm/daveio/README.md for the kubeseal command
that produces it. This template exists so `helm template` renders and so the
API deployment's checksum annotation has something to hash; replace it with the
generated SealedSecret before deploying.

A plain Secret with real values must never be committed: it is base64, not
encryption, and the repository's gitleaks job would fail the build - which is
the intended outcome rather than an obstacle.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "daveio.fullname" . }}-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE-WITH-SEALEDSECRET"
  NEO4J_PASSWORD: "REPLACE-WITH-SEALEDSECRET"
  NEO4J_AUTH: "neo4j/REPLACE-WITH-SEALEDSECRET"
  SESSION_SECRET: "REPLACE-WITH-SEALEDSECRET"
  GOOGLE_CLIENT_ID: "REPLACE-WITH-SEALEDSECRET"
  GOOGLE_CLIENT_SECRET: "REPLACE-WITH-SEALEDSECRET"
  AWS_KMS_KEY_ID: "REPLACE-WITH-SEALEDSECRET"
  AWS_ACCESS_KEY_ID: "REPLACE-WITH-SEALEDSECRET"
  AWS_SECRET_ACCESS_KEY: "REPLACE-WITH-SEALEDSECRET"
---
