{{/*
Postgres and Neo4j as StatefulSets with PersistentVolumeClaims.

In-cluster rather than managed, which is the decision in docs/HOSTED-PLAN.md:
no cloud bill, and backups become our responsibility - see the CronJob below,
and read its comment before trusting it.
*/}}
{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "daveio.fullname" . }}-postgres
  labels: {{- include "daveio.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "daveio.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels: { app: daveio-postgres }
  template:
    metadata:
      labels: { app: daveio-postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "daveio.fullname" . }}-secrets, key: POSTGRES_PASSWORD } }
            # The default data directory is the mount point itself, and
            # postgres refuses to initialise into a non-empty directory - which
            # a PVC is, thanks to lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"] }
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "daveio.fullname" . }}-postgres
spec:
  selector: { app: daveio-postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
{{- end }}
{{- if .Values.neo4j.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "daveio.fullname" . }}-neo4j
  labels: {{- include "daveio.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "daveio.fullname" . }}-neo4j
  replicas: 1
  selector:
    matchLabels: { app: daveio-neo4j }
  template:
    metadata:
      labels: { app: daveio-neo4j }
    spec:
      containers:
        - name: neo4j
          image: {{ .Values.neo4j.image }}
          ports: [{ containerPort: 7687 }, { containerPort: 7474 }]
          env:
            - name: NEO4J_AUTH
              valueFrom: { secretKeyRef: { name: {{ include "daveio.fullname" . }}-secrets, key: NEO4J_AUTH } }
            - name: NEO4J_server_memory_heap_max__size
              value: {{ .Values.neo4j.heap | quote }}
            - name: NEO4J_ACCEPT_LICENSE_AGREEMENT
              value: "yes"
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            tcpSocket: { port: 7687 }
            initialDelaySeconds: 20
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.neo4j.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "daveio.fullname" . }}-neo4j
spec:
  selector: { app: daveio-neo4j }
  ports:
    - { name: bolt, port: 7687, targetPort: 7687 }
    - { name: http, port: 7474, targetPort: 7474 }
{{- end }}
{{- if .Values.demo.enabled }}
---
{{/*
moto, the mock AWS control plane tenants can switch to (ADR-020).

No persistence: the seeder rebuilds it, and a demo account that survives a
restart with half-applied drift is more confusing than one that starts clean.
It has no Service exposed outside the cluster and is reachable only by the API
and the worker.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "daveio.fullname" . }}-moto
  labels: {{- include "daveio.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: daveio-moto }
  template:
    metadata:
      labels: { app: daveio-moto }
    spec:
      containers:
        - name: moto
          image: {{ .Values.demo.image }}
          ports: [{ containerPort: 5000 }]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "daveio.fullname" . }}-moto
spec:
  selector: { app: daveio-moto }
  ports: [{ port: 5000, targetPort: 5000 }]
{{- end }}
