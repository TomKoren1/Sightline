name: Release

# A version tag publishes the two images, built once and identified by digest.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# GitHub's container registry is free for a public repository, and every step
# here is too: the scan, the SBOM, the provenance and the keyless signature.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build, scan, sign and push
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      ref: ${{ github.sha }}
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha,format=short
