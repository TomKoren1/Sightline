name: Release

# A version tag publishes the two images, built once and identified by digest.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# GitHub's container registry is free for a public repository, and every step
# here is too: the scan, the SBOM, the provenance and the keyless signature.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build, scan, sign and push ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges the workflow's OIDC token for a
      # short-lived certificate, so there is no signing key to hold or leak.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, web]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/sightline-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names must be lower case; the owner may not be.
      - name: Image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Built and loaded first, so the scan sees exactly the image that is
      # pushed afterwards, and a finding stops the push rather than following it.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - id: push
        name: Push, with an SBOM and provenance attached
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.target }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign by digest
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: Record what was published
        run: |
          {
            echo "### sightline-${{ matrix.target }}"
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "Deploy by digest, and verify before you do:"
            echo
            echo '```'
            echo "cosign verify ${IMAGE}@${{ steps.push.outputs.digest }} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
