name: Images

# Build, scan, sign and push the two images. Called by release.yml for a
# version tag and by deliver.yml for every commit on main that passed CI, so
# both publish exactly the same way: scanned before the push, signed by
# digest, with an SBOM and provenance attached.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        type: string
        required: true
      tags:
        description: docker/metadata-action tag rules, one per line
        type: string
        required: true

permissions:
  contents: read

jobs:
  image:
    name: Build, scan, sign and push ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges the workflow's OIDC token for a
      # short-lived certificate, so there is no signing key to hold or leak.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, web]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/sightline-${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names must be lower case; the owner may not be.
      - name: Image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.tags }}

      # Built and loaded first, so the scan sees exactly the image that is
      # pushed afterwards, and a finding stops the push rather than following it.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          build-args: GIT_COMMIT=${{ inputs.ref }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - id: push
        name: Push, with an SBOM and provenance attached
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The same as the scanned build, or the image pushed is not the one scanned.
          build-args: GIT_COMMIT=${{ inputs.ref }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.target }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign by digest
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: Record what was published
        run: |
          {
            echo "### sightline-${{ matrix.target }}"
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "Deploy by digest, and verify before you do:"
            echo
            echo '```'
            echo "cosign verify ${IMAGE}@${{ steps.push.outputs.digest }} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
