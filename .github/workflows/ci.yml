name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  # Fast feedback: types, formatting and everything that needs no services.
  static:
    name: Types, format and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Lint and formatting
        # Prettier for formatting, ESLint for correctness. The type-aware rules
        # need the tsconfigs, which is why this runs after `npm ci` rather than
        # as a standalone action.
        run: npm run lint

      - name: Unit tests
        # The integration suite needs the compose stack and runs in the next
        # job; this one must stay fast and dependency-free. SKIP_INTEGRATION
        # also switches off the suites that issue real HTTP requests, which
        # would otherwise spend thirty seconds per request timing out against
        # databases that are not here.
        #
        # The exclusion names one file rather than the whole `evals/` directory.
        # `**/evals/**` also excluded `readme.test.ts` and `summarise.test.ts`,
        # which need no databases and no API key - so thirty-two assertions,
        # including all twenty-five guarding the documentation against rot, ran
        # nowhere at all. `groundTruth.test.ts` is the only one that needs the
        # stack, and the integration job runs it explicitly.
        env:
          SKIP_INTEGRATION: "1"
        run: npx vitest run --exclude '**/evals/groundTruth.test.ts'

      - name: Build frontend
        run: npm run build -w @sightline/web

  # The claim this project makes is that it runs end to end. This proves it,
  # through exactly the commands the README tells a reader to use.
  integration:
    name: End-to-end scan against the mock account
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Start Postgres and the mock AWS control plane
        run: |
          cp .env.example .env
          docker compose up -d

      - name: Wait for services to be healthy
        run: |
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format json \
              | jq -r 'select(.Health != "healthy" and .Health != "") | .Service' || true)
            if [ -z "$unhealthy" ]; then echo "all services healthy"; exit 0; fi
            echo "waiting for: $unhealthy"
            sleep 3
          done
          echo "services did not become healthy in time"
          docker compose ps
          docker compose logs --tail 50
          exit 1

      - name: Seed the mock AWS account
        run: npm run seed

      - name: Run a full scan and persist it
        run: npm run scan

      - name: Every integration test
        # The unit job sets SKIP_INTEGRATION, so until this step the tests that
        # need Postgres or moto - tenant isolation, row-level security, the
        # collector contracts - ran on developers' machines and nowhere else.
        # Before the ground-truth step, which drifts the mock account.
        run: >-
          npx vitest run
          --exclude '**/evals/groundTruth.test.ts'
          --exclude '**/load/largeAccount.test.ts'

      - name: Ground-truth assertions
        # Tier 1 of the eval suite. Needs no API key, and catches the
        # regression that matters most: an analyser becoming quietly wrong.
        run: npx vitest run apps/api/src/evals/groundTruth.test.ts

      - name: HTTP routing against the live stack
        # Proves the router reaches its handlers for a real, full-length ARN.
        # Needs the databases, so it cannot run in the unit job.
        run: npx vitest run apps/api/src/http/graph/resourceArn.test.ts

      - name: Verify the API serves what the scan produced
        run: |
          npx tsx apps/api/src/server.ts &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health >/dev/null && break
            sleep 2
          done

          echo "--- health ---"
          curl -sf http://localhost:3000/api/health | jq .

          echo "--- graph must be non-empty ---"
          nodes=$(curl -sf "http://localhost:3000/api/graph?limit=500" | jq '.nodes | length')
          echo "nodes: $nodes"
          [ "$nodes" -gt 50 ] || { echo "graph is suspiciously small"; exit 1; }

          echo "--- findings must include the seeded public bucket ---"
          curl -sf http://localhost:3000/api/findings \
            | jq -e '.publicResources[] | select(.name == "northwind-public-assets")' >/dev/null

          echo "--- and must NOT include the neutralised one ---"
          if curl -sf http://localhost:3000/api/findings \
            | jq -e '.publicResources[] | select(.name == "northwind-reports")' >/dev/null; then
            echo "northwind-reports was reported public; its access block should have neutralised it"
            exit 1
          fi

      - name: Large-account load test (50,000 resources)
        # The demo estate multiplied to a large account and put through
        # analysis, the snapshot write, findings sync and every dashboard and
        # agent query, against time budgets. Last, because it is the slowest
        # step and leaves nothing behind for the others to trip over.
        env:
          LOAD_TEST: "1"
          # The scan copied into two more accounts, so queries filter tables
          # three times its size. The million-resource run is nightly.
          LOAD_ACCOUNTS: "3"
        run: npx vitest run apps/api/test/load/largeAccount.test.ts

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 100

  # The hosted product, driven through a real browser the way a customer drives
  # it: sign in, scan, read the findings, ask, connect. GitHub and Anthropic are
  # stood in for on loopback (`e2e/stubs.ts`); everything between them is the
  # real code, with the API and the worker as separate processes.
  browser:
    name: Sign in, scan and ask, in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Start Postgres and the mock AWS control plane
        run: |
          cp .env.example .env
          docker compose up -d

      - name: Install Chromium
        # While the services start.
        run: npx playwright install --with-deps chromium

      - name: Wait for services to be healthy
        run: |
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format json \
              | jq -r 'select(.Health != "healthy" and .Health != "") | .Service' || true)
            if [ -z "$unhealthy" ]; then echo "all services healthy"; exit 0; fi
            echo "waiting for: $unhealthy"
            sleep 3
          done
          docker compose ps
          exit 1

      - name: Seed the mock AWS account
        run: npm run seed

      - name: The journey
        run: npm run e2e

      - name: Traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-suite
          path: test-results/
          retention-days: 7

  # The manifests and the chart against Kubernetes' own schemas. The guards/
  # tests check what only this project knows - that two files agree; whether a
  # field exists at all is kubeconform's question, and it knows every one.
  manifests:
    name: Manifests and chart validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render every overlay and the monitoring chart
        # kubectl and helm come with the runner image.
        run: |
          mkdir -p rendered
          for overlay in prod staging; do
            kubectl kustomize "deploy/k8s/$overlay" > "rendered/$overlay.yaml"
          done
          # The runner has no chart repositories configured; Chart.lock pins
          # the versions, these only say where to fetch them from.
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm dependency build helm/monitoring
          helm lint helm/monitoring
          helm template monitoring helm/monitoring > rendered/monitoring.yaml

      - name: kubeconform
        # -strict refuses unknown fields, the typo that applies cleanly and is
        # then ignored. Custom resources with no published schema are skipped.
        run: |
          docker run --rm -v "$PWD/rendered:/m"             ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e             -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0             /m/prod.yaml /m/staging.yaml /m/monitoring.yaml

  # The platform's AWS resources as code (deploy/terraform). Formatting and
  # validity only: a plan needs AWS credentials, which CI does not hold, and
  # applying is done by hand after reading the plan.
  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - run: tofu fmt -check -diff
      - run: tofu init -backend=false -input=false
      - run: tofu validate

  # The README offers a second way to run the project. A documented path that CI
  # does not exercise is worse than no path at all, because it is a claim nobody
  # has checked - so this runs the exact command the README gives and drives the
  # product through nginx, not through the API directly.
  containerised:
    name: The whole stack in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bring up everything, including the app
        run: |
          cp .env.example .env
          docker compose --profile app up -d --build

      - name: Wait for the app to be serving
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health >/dev/null; then
              echo "serving"; exit 0
            fi
            sleep 5
          done
          echo "the app did not come up"
          docker compose --profile app ps
          docker compose --profile app logs --tail 80
          exit 1

      - name: The seeder must have populated the mock account
        # It runs as a one-shot service, so a non-zero exit here means the
        # account is empty and every later assertion would fail confusingly.
        run: |
          code=$(docker inspect sightline-seed --format '{{.State.ExitCode}}')
          echo "seed exit code: $code"
          [ "$code" = "0" ] || { docker compose logs seed --tail 40; exit 1; }

      - name: The frontend is served, and client routes fall back to it
        run: |
          curl -sf http://localhost:8080/ | grep -q '<!doctype html>'
          # A deep link is a route, not a missing file.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/some/client/route)" = "200" ]

      - name: A scan streams through the proxy rather than arriving at the end
        # The assertion that matters for nginx: progress events must arrive
        # before the run finishes. A buffering proxy delivers everything at once,
        # which silently removes the progress reporting.
        run: |
          curl -sN --max-time 120 -X POST http://localhost:8080/api/scans > /tmp/sse.txt
          grep -q '"type":"scan.started"' /tmp/sse.txt
          grep -q '"type":"unit.finished"' /tmp/sse.txt
          grep -q '"type":"scan.finished"' /tmp/sse.txt
          # Several units, so this was a real fan-out and not a stub.
          units=$(grep -c '"type":"unit.finished"' /tmp/sse.txt)
          echo "units reported: $units"
          [ "$units" -gt 5 ] || { echo "too few units streamed"; exit 1; }

      - name: The graph and findings are served through the proxy
        run: |
          nodes=$(curl -sf "http://localhost:8080/api/graph?limit=500" | jq '.nodes | length')
          echo "nodes: $nodes"
          [ "$nodes" -gt 50 ] || { echo "graph is suspiciously small"; exit 1; }
          curl -sf http://localhost:8080/api/findings \
            | jq -e '.publicResources[] | select(.name == "northwind-public-assets")' >/dev/null

      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs --tail 120

  # `npm run setup` writes .env and can deploy to AWS, so what CI can check is
  # the half that must never be wrong: that it refuses, explains and changes
  # nothing when it cannot proceed. The AWS path itself needs credentials CI does
  # not have, and faking them would test the fake.
  setup-script:
    name: Setup script refuses safely
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: --help works without a .env
        run: npm run setup -- --help

      - name: --dry-run on the demo account changes nothing
        run: |
          cp .env.example .env
          before=$(sha256sum .env | cut -d' ' -f1)
          npm run setup -- --mock --dry-run --yes
          after=$(sha256sum .env | cut -d' ' -f1)
          [ "$before" = "$after" ] || { echo ".env was modified by --dry-run"; exit 1; }
          if ls .env.backup-* >/dev/null 2>&1; then
            echo "--dry-run created a backup, so it wrote something"; exit 1
          fi
          echo "--dry-run left everything alone."

      - name: it refuses a .env with duplicate keys, and writes nothing
        run: |
          cp .env.example .env
          echo "AWS_MODE=mock" >> .env
          before=$(sha256sum .env | cut -d' ' -f1)
          if npm run setup -- --mock --yes; then
            echo "it accepted an ambiguous .env"; exit 1
          fi
          after=$(sha256sum .env | cut -d' ' -f1)
          [ "$before" = "$after" ] || { echo ".env was modified despite refusing"; exit 1; }
          echo "Refused, and left the file alone."

      - name: the real path stops when there are no AWS credentials
        env:
          # Point the CLI at a profile that does not exist, so
          # get-caller-identity cannot succeed.
          AWS_PROFILE: definitely-not-configured
        run: |
          cp .env.example .env
          before=$(sha256sum .env | cut -d' ' -f1)
          if npm run setup -- --yes --region us-east-1; then
            echo "it continued without credentials"; exit 1
          fi
          after=$(sha256sum .env | cut -d' ' -f1)
          [ "$before" = "$after" ] || { echo ".env was modified before credentials were checked"; exit 1; }
          echo "Stopped before touching anything."

      - name: --mock actually writes, so the checks above mean something
        # A script that never writes would pass every assertion in this job.
        run: |
          cp .env.example .env
          sed -i 's/^AWS_MODE=mock/AWS_MODE=real/' .env
          npm run setup -- --mock --yes
          grep -q '^AWS_MODE=mock$' .env || { echo "it did not write AWS_MODE"; exit 1; }
          ls .env.backup-* >/dev/null 2>&1 || { echo "no backup was taken"; exit 1; }
          echo "Wrote the change and backed up first."

  # The repository holds AWS role ARNs, external ids and an LLM key in .env.
  # A leak check is cheap and the consequences of skipping it are not.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks lists a pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      # A deterministic backstop for the failure that actually happened: a
      # file called `.env.mock-backup`, holding a live API key, tracked because
      # .gitignore listed exact filenames. Pattern matching can miss a secret;
      # this cannot miss the file.
      - name: No environment files may be tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.env$' | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "Environment files are tracked, which is how secrets leak:"
            echo "$tracked"
            echo
            echo "Remove them from the index and confirm .gitignore covers them."
            exit 1
          fi
          echo "Only .env.example is tracked."

      - name: Example env must not contain real secrets
        run: |
          if grep -qE 'sk-ant-[a-zA-Z0-9_-]{20,}' .env.example; then
            echo ".env.example contains what looks like a real Anthropic key"; exit 1
          fi
          # Two greps rather than one negative lookahead, so this line does not
          # itself contain `AWS_EXTERNAL_ID=` followed by a credential-shaped
          # string - which the repository's own gitleaks rule flags, and which the
          # unit-suite mirror of those rules caught here.
          if grep -E '^AWS_EXTERNAL_ID=' .env.example | grep -qvE '=(replace-me|local-dev)'; then
            echo ".env.example contains what looks like a real ExternalId"; exit 1
          fi
          echo ".env.example carries placeholders only."
