name: Agent evals

# Tier 2 of the eval suite. Kept off the default CI path because it
# costs money and needs a key: run it deliberately before merging a change to
# the prompt, the tools or the model.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to evaluate
        required: false
        default: claude-sonnet-5
  schedule:
    # Weekly, so a drift in model behaviour is noticed before a demo does it
    # for us.
    - cron: "0 6 * * 1"

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  evals:
    name: Agent answer quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Start services
        run: |
          cp .env.example .env
          docker compose up -d
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format json \
              | jq -r 'select(.Health != "healthy" and .Health != "") | .Service' || true)
            [ -z "$unhealthy" ] && break
            sleep 3
          done

      - name: Seed and scan
        run: |
          npm run seed
          npm run scan

      - name: Run agent evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ inputs.model || 'claude-sonnet-5' }}
        run: npm run evals

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: warn
