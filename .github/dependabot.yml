# Grouped so a week's patches arrive as one reviewable PR. The AWS SDK alone
# publishes most days, and this project depends on six of its clients.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      nest:
        patterns: ["@nestjs/*"]
      dev-tooling:
        patterns:
          ["eslint*", "@eslint/*", "typescript-eslint", "prettier", "vitest", "tsx", "typescript"]
      production:
        dependency-type: production
        update-types: ["minor", "patch"]

  # Notices when a pinned action major goes end-of-life.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Base images. `node:22-alpine` and `nginx:alpine` float on patch, so this is
  # what notices a major going out of support rather than a silent rebuild.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
