# Grouped so a week's patches arrive as one reviewable PR. The AWS SDK alone
# publishes most days, and this project depends on six of its clients.
#
# Two rules learned from the first batch this config produced:
#
#   - React's four packages move together. Split across groups, `react-dom` went
#     to 19 while `react` stayed on 18, which gives two copies of
#     `@types/react` and a wall of "cannot be used as a JSX component" because
#     v19 adds `bigint` to `ReactNode`. Neither PR was mergeable alone.
#   - Groups take minor and patch only. A dev-tooling group that swept up ESLint
#     10 and TypeScript 7 together was one unreviewable PR failing every job.
#     Majors now arrive individually, which is the only way to judge them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      aws-sdk:
        patterns: ["@aws-sdk/*"]
        update-types: ["minor", "patch"]
      nest:
        patterns: ["@nestjs/*"]
        update-types: ["minor", "patch"]
      # Released in lockstep: the 0.x exporters and the 2.x SDK each require
      # their own version of the rest. Inside `production`, a bump that moved
      # the SDK but not `resources` failed to load and held 21 unrelated
      # updates back with it.
      opentelemetry:
        patterns: ["@opentelemetry/*"]
        update-types: ["minor", "patch"]
      dev-tooling:
        patterns:
          ["eslint*", "@eslint/*", "typescript-eslint", "prettier", "vitest", "tsx", "typescript"]
        update-types: ["minor", "patch"]
      production:
        dependency-type: production
        update-types: ["minor", "patch"]

  # Notices when a pinned action major goes end-of-life.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Every image is pinned to a version and digest (infra/imagePins.test.ts), so
  # nothing changes without a PR; these are what raise that PR. `docker` reads
  # the Dockerfile and the Kubernetes manifests, `docker-compose` the stack.
  - package-ecosystem: docker
    directories: ["/", "/deploy/k8s/base", "/deploy/k8s/prod"]
    schedule:
      interval: monthly
    # A Postgres major cannot start on the previous major's data directory: it
    # is a dump and restore, planned, not a merge. CI passes such a PR because
    # it starts from an empty database, which is exactly what makes it unsafe.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
