# Dependency updates, grouped so that a week's patches arrive as one reviewable
# pull request rather than fifteen. The AWS SDK alone would otherwise open a
# handful every week - it publishes most days, and this project depends on six
# of its clients.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      nest:
        patterns: ["@nestjs/*"]
      dev-tooling:
        patterns:
          ["eslint*", "@eslint/*", "typescript-eslint", "prettier", "vitest", "tsx", "typescript"]
      production:
        dependency-type: production
        update-types: ["minor", "patch"]

  # The workflows pin actions by major version, so this is what notices when a
  # pinned major goes end-of-life - the failure mode being a deprecation warning
  # nobody reads until the action stops running.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
