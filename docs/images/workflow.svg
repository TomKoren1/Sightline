<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" width="2000" height="1000" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2230"/>
      <stop offset="1" stop-color="#151925"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee6d6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a3b"/>
      <stop offset="1" stop-color="#1a1f2c"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6d6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5ff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ee6d6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2ee6d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="circuit" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 40 H30 L40 30 V0 M80 50 H55 L45 60 V80" fill="none" stroke="#2b3245" stroke-width="2"/>
      <circle cx="40" cy="30" r="2.5" fill="#2b3245"/>
      <circle cx="45" cy="60" r="2.5" fill="#2b3245"/>
    </pattern>
  </defs>

  <rect width="2000" height="1000" fill="url(#bg)"/>

  <!-- Panels: x = 50 + i*390, width 340, y 120..760 -->
  <g id="panels">
    <g>
      <rect x="50" y="120" width="340" height="640" rx="22" fill="url(#panel)"/>
      <rect x="50" y="120" width="340" height="640" rx="22" fill="url(#circuit)" opacity="0.6"/>
      <rect x="50" y="120" width="340" height="640" rx="22" fill="none" stroke="#2ee6d6" stroke-width="3" filter="url(#softglow)"/>
    </g>
    <g>
      <rect x="440" y="120" width="340" height="640" rx="22" fill="url(#panel)"/>
      <rect x="440" y="120" width="340" height="640" rx="22" fill="url(#circuit)" opacity="0.6"/>
      <rect x="440" y="120" width="340" height="640" rx="22" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#softglow)"/>
    </g>
    <g>
      <rect x="830" y="120" width="340" height="640" rx="22" fill="url(#panel)"/>
      <rect x="830" y="120" width="340" height="640" rx="22" fill="url(#circuit)" opacity="0.6"/>
      <rect x="830" y="120" width="340" height="640" rx="22" fill="none" stroke="#818cf8" stroke-width="3" filter="url(#softglow)"/>
    </g>
    <g>
      <rect x="1220" y="120" width="340" height="640" rx="22" fill="url(#panel)"/>
      <rect x="1220" y="120" width="340" height="640" rx="22" fill="url(#circuit)" opacity="0.6"/>
      <rect x="1220" y="120" width="340" height="640" rx="22" fill="none" stroke="#a78bfa" stroke-width="3" filter="url(#softglow)"/>
    </g>
    <g>
      <rect x="1610" y="120" width="340" height="640" rx="22" fill="url(#panel)"/>
      <rect x="1610" y="120" width="340" height="640" rx="22" fill="url(#circuit)" opacity="0.6"/>
      <rect x="1610" y="120" width="340" height="640" rx="22" fill="none" stroke="#c084fc" stroke-width="3" filter="url(#softglow)"/>
    </g>
  </g>

  <!-- Chevrons between panels -->
  <g fill="none" stroke="url(#cyanPurple)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#softglow)">
    <path d="M404 410 L426 440 L404 470"/>
    <path d="M794 410 L816 440 L794 470"/>
    <path d="M1184 410 L1206 440 L1184 470"/>
    <path d="M1574 410 L1596 440 L1574 470"/>
  </g>

  <!-- Step badges -->
  <g font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="90" cy="160" r="20" fill="#13202a" stroke="#2ee6d6" stroke-width="2"/><text x="90" y="168" fill="#2ee6d6">1</text>
    <circle cx="480" cy="160" r="20" fill="#13202a" stroke="#38bdf8" stroke-width="2"/><text x="480" y="168" fill="#38bdf8">2</text>
    <circle cx="870" cy="160" r="20" fill="#191b30" stroke="#818cf8" stroke-width="2"/><text x="870" y="168" fill="#818cf8">3</text>
    <circle cx="1260" cy="160" r="20" fill="#1c1a32" stroke="#a78bfa" stroke-width="2"/><text x="1260" y="168" fill="#a78bfa">4</text>
    <circle cx="1650" cy="160" r="20" fill="#1f1a32" stroke="#c084fc" stroke-width="2"/><text x="1650" y="168" fill="#c084fc">5</text>
  </g>

  <!-- 1. Connect: a cloud, a read-only role (shield with eye), a padlocked data store -->
  <g>
    <ellipse cx="220" cy="460" rx="150" ry="150" fill="url(#halo)"/>
    <path d="M140 360 a45 45 0 0 1 40 -55 a60 60 0 0 1 110 15 a40 40 0 0 1 10 80 h-150 a40 40 0 0 1 -10 -40z" fill="#253049" stroke="#5eead4" stroke-width="3" filter="url(#softglow)"/>
    <text x="222" y="372" text-anchor="middle" font-size="22" font-weight="700" fill="#5eead4">AWS</text>
    <!-- beam down -->
    <path d="M220 405 V450" stroke="#5eead4" stroke-width="3" stroke-dasharray="6 6"/>
    <!-- shield -->
    <path d="M220 450 l70 25 v55 c0 50 -35 80 -70 95 c-35 -15 -70 -45 -70 -95 v-55z" fill="#1b2a35" stroke="url(#cyanPurple)" stroke-width="4" filter="url(#glow)"/>
    <path d="M180 545 q40 -40 80 0 q-40 40 -80 0z" fill="none" stroke="#e0f2fe" stroke-width="3"/>
    <circle cx="220" cy="545" r="11" fill="#2ee6d6"/>
    <!-- deny pill -->
    <rect x="135" y="660" width="170" height="38" rx="19" fill="#2a1820" stroke="#fb7185" stroke-width="2"/>
    <text x="220" y="685" text-anchor="middle" font-size="17" font-weight="600" fill="#fda4af">✕ data-plane reads</text>
  </g>

  <!-- 2. Scan: a radar sweep across services x regions -->
  <g>
    <ellipse cx="610" cy="460" rx="150" ry="150" fill="url(#halo)"/>
    <g font-size="15" fill="#94a3b8" text-anchor="middle">
      <text x="560" y="300">us-east-1</text><text x="650" y="300">eu-west-1</text><text x="735" y="300">ap-se-1</text>
    </g>
    <g font-size="15" fill="#94a3b8" text-anchor="end">
      <text x="512" y="345">EC2</text><text x="512" y="400">S3</text><text x="512" y="455">IAM</text><text x="512" y="510">RDS</text><text x="512" y="565">VPC</text><text x="512" y="620">Lambda</text>
    </g>
    <g>
      <!-- done cells -->
      <g fill="#123b3c" stroke="#2ee6d6" stroke-width="2">
        <rect x="530" y="322" width="60" height="34" rx="6"/><rect x="618" y="322" width="60" height="34" rx="6"/><rect x="705" y="322" width="60" height="34" rx="6"/>
        <rect x="530" y="377" width="60" height="34" rx="6"/><rect x="618" y="377" width="60" height="34" rx="6"/><rect x="705" y="377" width="60" height="34" rx="6"/>
        <rect x="530" y="432" width="60" height="34" rx="6"/><rect x="618" y="432" width="60" height="34" rx="6"/><rect x="705" y="432" width="60" height="34" rx="6"/>
        <rect x="530" y="487" width="60" height="34" rx="6"/><rect x="618" y="487" width="60" height="34" rx="6"/>
      </g>
      <g fill="#5eead4" font-size="18" font-weight="700" text-anchor="middle">
        <text x="560" y="345">✓</text><text x="648" y="345">✓</text><text x="735" y="345">✓</text>
        <text x="560" y="400">✓</text><text x="648" y="400">✓</text><text x="735" y="400">✓</text>
        <text x="560" y="455">✓</text><text x="648" y="455">✓</text><text x="735" y="455">✓</text>
        <text x="560" y="510">✓</text><text x="648" y="510">✓</text>
      </g>
      <!-- scanning cell -->
      <rect x="705" y="487" width="60" height="34" rx="6" fill="#1b2d4a" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
      <g fill="#38bdf8"><circle cx="722" cy="504" r="4"/><circle cx="735" cy="504" r="4" opacity="0.7"/><circle cx="748" cy="504" r="4" opacity="0.4"/></g>
      <!-- pending cells -->
      <g fill="#1e2433" stroke="#3b4560" stroke-width="2">
        <rect x="530" y="542" width="60" height="34" rx="6"/><rect x="618" y="542" width="60" height="34" rx="6"/><rect x="705" y="542" width="60" height="34" rx="6"/>
        <rect x="530" y="597" width="60" height="34" rx="6"/><rect x="618" y="597" width="60" height="34" rx="6"/><rect x="705" y="597" width="60" height="34" rx="6"/>
      </g>
      <!-- sweep line -->
      <path d="M520 482 H775" stroke="#38bdf8" stroke-width="3" opacity="0.8" filter="url(#glow)"/>
    </g>
    <!-- progress bar -->
    <rect x="530" y="665" width="235" height="12" rx="6" fill="#1e2433"/>
    <rect x="530" y="665" width="160" height="12" rx="6" fill="url(#cyanPurple)" filter="url(#softglow)"/>
  </g>

  <!-- 3. Analyse: a graph whose computed path reaches a private database -->
  <g>
    <ellipse cx="1000" cy="460" rx="150" ry="150" fill="url(#haloRed)"/>
    <!-- edges -->
    <g stroke="#3b4560" stroke-width="3" fill="none">
      <path d="M905 330 L1000 300"/><path d="M1000 300 L1095 340"/><path d="M905 330 L920 450"/><path d="M1095 340 L1080 450"/>
      <path d="M920 450 L1000 555"/>
    </g>
    <!-- computed CAN_REACH path -->
    <g stroke="#fb7185" stroke-width="4" fill="none" filter="url(#glow)" stroke-dasharray="10 7">
      <path d="M1000 300 L1080 450 L1000 555"/>
    </g>
    <!-- internet globe -->
    <circle cx="1000" cy="300" r="28" fill="#1b2a35" stroke="#5eead4" stroke-width="3"/>
    <ellipse cx="1000" cy="300" rx="12" ry="28" fill="none" stroke="#5eead4" stroke-width="2"/>
    <path d="M972 300 H1028" stroke="#5eead4" stroke-width="2"/>
    <!-- nodes -->
    <g fill="#232c42" stroke="#818cf8" stroke-width="3">
      <circle cx="905" cy="330" r="18"/><circle cx="1095" cy="340" r="18"/><circle cx="920" cy="450" r="18"/>
    </g>
    <rect x="1056" y="430" width="48" height="40" rx="8" fill="#232c42" stroke="#fb7185" stroke-width="3"/>
    <text x="1080" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#fda4af">SG</text>
    <!-- database -->
    <g filter="url(#glow)">
      <path d="M955 545 v55 a45 14 0 0 0 90 0 v-55" fill="#2a1d2e" stroke="#fb7185" stroke-width="3"/>
      <ellipse cx="1000" cy="545" rx="45" ry="14" fill="#3a2335" stroke="#fb7185" stroke-width="3"/>
      <path d="M955 572 a45 14 0 0 0 90 0" fill="none" stroke="#fb7185" stroke-width="2"/>
    </g>
    <!-- verdict tag -->
    <rect x="900" y="650" width="200" height="40" rx="8" fill="#2a1820" stroke="#fb7185" stroke-width="2"/>
    <text x="1000" y="676" text-anchor="middle" font-size="18" font-weight="700" fill="#fb7185" letter-spacing="1">EXPOSED</text>
    <text x="1000" y="715" text-anchor="middle" font-size="15" fill="#94a3b8">publiclyAccessible: false</text>
  </g>

  <!-- 4. Ask: a question, and the agent choosing tools -->
  <g>
    <ellipse cx="1390" cy="460" rx="150" ry="150" fill="url(#halo)"/>
    <!-- user bubble -->
    <path d="M1250 290 h250 a16 16 0 0 1 16 16 v62 a16 16 0 0 1 -16 16 h-200 l-26 22 v-22 h-24 a16 16 0 0 1 -16 -16 v-62 a16 16 0 0 1 16 -16z" fill="#2a2f45" stroke="#a78bfa" stroke-width="3" filter="url(#softglow)"/>
    <text x="1267" y="327" font-size="19" fill="#e0e7ff">What can reach the</text>
    <text x="1267" y="355" font-size="19" fill="#e0e7ff">production database?</text>
    <!-- agent core -->
    <g filter="url(#glow)">
      <circle cx="1390" cy="500" r="52" fill="#1f1f3a" stroke="url(#cyanPurple)" stroke-width="4"/>
      <path d="M1390 470 l9 22 l22 9 l-22 9 l-9 22 l-9 -22 l-22 -9 l22 -9z" fill="#c4b5fd"/>
    </g>
    <!-- tool chips -->
    <g font-family="'Cascadia Code', Consolas, monospace" font-size="14">
      <rect x="1234" y="590" width="168" height="34" rx="8" fill="#1e2a3a" stroke="#38bdf8" stroke-width="2"/>
      <text x="1318" y="612" text-anchor="middle" fill="#7dd3fc">find_network_paths</text>
      <rect x="1412" y="590" width="136" height="34" rx="8" fill="#1e2a3a" stroke="#38bdf8" stroke-width="2"/>
      <text x="1480" y="612" text-anchor="middle" fill="#7dd3fc">get_resource</text>
      <rect x="1280" y="640" width="220" height="34" rx="8" fill="#22233a" stroke="#a78bfa" stroke-width="2"/>
      <text x="1390" y="662" text-anchor="middle" fill="#c4b5fd">read-only · one scan</text>
    </g>
    <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 5" fill="none">
      <path d="M1360 548 L1320 590"/><path d="M1420 548 L1460 590"/>
    </g>
  </g>

  <!-- 5. Check: an answer whose every citation is matched against the tool results -->
  <g>
    <ellipse cx="1780" cy="460" rx="150" ry="150" fill="url(#halo)"/>
    <g filter="url(#softglow)">
      <path d="M1680 290 h170 l40 40 v330 h-210z" fill="url(#paper)"/>
      <path d="M1850 290 v40 h40" fill="#a5b4fc"/>
    </g>
    <g fill="#94a3b8">
      <rect x="1700" y="320" width="120" height="10" rx="5"/>
      <rect x="1700" y="342" width="160" height="8" rx="4" opacity="0.7"/>
      <rect x="1700" y="358" width="140" height="8" rx="4" opacity="0.7"/>
    </g>
    <!-- citations -->
    <g font-family="'Cascadia Code', Consolas, monospace" font-size="14">
      <rect x="1700" y="390" width="170" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
      <text x="1712" y="411" fill="#065f46">✓ prod-bastion-sg</text>
      <rect x="1700" y="432" width="170" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
      <text x="1712" y="453" fill="#065f46">✓ prod-app-sg</text>
      <rect x="1700" y="474" width="170" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
      <text x="1712" y="495" fill="#065f46">✓ prod-alb</text>
      <rect x="1700" y="516" width="170" height="32" rx="6" fill="#ffe4e6" stroke="#f43f5e" stroke-width="2"/>
      <text x="1712" y="537" fill="#9f1239">⚠ unsupported</text>
    </g>
    <g fill="#94a3b8">
      <rect x="1700" y="570" width="160" height="8" rx="4" opacity="0.7"/>
      <rect x="1700" y="588" width="110" height="8" rx="4" opacity="0.7"/>
    </g>
    <!-- big check -->
    <g filter="url(#glow)">
      <circle cx="1880" cy="640" r="40" fill="#0f2a2a" stroke="#2ee6d6" stroke-width="4"/>
      <path d="M1862 640 l13 13 l24 -27" fill="none" stroke="#5eead4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Labels -->
  <g text-anchor="middle" fill="#e2e8f0" font-size="27" font-weight="500" letter-spacing="1">
    <text x="220" y="830">CONNECT A</text><text x="220" y="866">READ-ONLY ROLE</text>
    <text x="610" y="830">SCAN EVERY</text><text x="610" y="866">SERVICE &amp; REGION</text>
    <text x="1000" y="830">COMPUTE VERDICTS</text><text x="1000" y="866">IN CODE</text>
    <text x="1390" y="830">ASK IN</text><text x="1390" y="866">PLAIN LANGUAGE</text>
    <text x="1780" y="830">CHECK EVERY</text><text x="1780" y="866">CITATION</text>
  </g>
  <g text-anchor="middle" fill="#94a3b8" font-size="19">
    <text x="220" y="906">(no write access, no secrets)</text>
    <text x="610" y="906">(streamed live, region by region)</text>
    <text x="1000" y="906">(public · admin · reachable)</text>
    <text x="1390" y="906">(Claude + curated tools)</text>
    <text x="1780" y="906">(unsupported ones are flagged)</text>
  </g>
</svg>
